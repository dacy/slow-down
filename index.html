<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#1a1814" media="(prefers-color-scheme: dark)" />
<title>慢 · slow</title>
<meta name="description" content="A small companion that doesn't try to make you more productive." />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<noscript>
  <main class="noscript">
    <p>This little thing needs JavaScript to work.</p>
    <p>But then again, you don't have to open it.</p>
  </main>
</noscript>

<main id="app" aria-live="polite">
  <!-- Home -->
  <section class="view" data-view="home" hidden>
    <div class="lang-toggle" role="group" aria-label="language">
      <button type="button" data-lang="zh">中</button>
      <span aria-hidden="true">·</span>
      <button type="button" data-lang="en">EN</button>
    </div>

    <header class="home-header">
      <h1 class="brand" data-i18n="brand">慢</h1>
      <p class="tagline" data-i18n="tagline"></p>
    </header>

    <nav class="menu" aria-label="practices">
      <button class="menu-item" type="button" data-go="sit">
        <span class="menu-title" data-i18n="sitTitle"></span>
        <span class="menu-sub" data-i18n="sitSub"></span>
      </button>
      <button class="menu-item" type="button" data-go="observe">
        <span class="menu-title" data-i18n="observeTitle"></span>
        <span class="menu-sub" data-i18n="observeSub"></span>
      </button>
      <button class="menu-item" type="button" data-go="undo">
        <span class="menu-title" data-i18n="undoTitle"></span>
        <span class="menu-sub" data-i18n="undoSub"></span>
      </button>
      <button class="menu-item" type="button" data-go="read">
        <span class="menu-title" data-i18n="readTitle"></span>
        <span class="menu-sub" data-i18n="readSub"></span>
      </button>
      <button class="menu-item" type="button" data-go="enough">
        <span class="menu-title" data-i18n="enoughTitle"></span>
        <span class="menu-sub" data-i18n="enoughSub"></span>
      </button>
    </nav>

    <footer class="home-foot">
      <p class="quiet" data-i18n="footA"></p>
      <p class="quiet" data-i18n="footB"></p>
    </footer>
  </section>

  <!-- Sit -->
  <section class="view" data-view="sit" hidden>
    <button class="leave" type="button" data-go="home" aria-label="leave">←</button>
    <div class="sit-stage">
      <div class="breath" aria-hidden="true">
        <div class="breath-orb"></div>
      </div>
      <p class="breath-hint" id="breath-hint" data-i18n="sitHint"></p>
    </div>
    <div class="sit-foot">
      <p class="quiet" id="sit-nudge"></p>
    </div>
  </section>

  <!-- Observe -->
  <section class="view" data-view="observe" hidden>
    <button class="leave" type="button" data-go="home" aria-label="leave">←</button>
    <div class="observe-wrap">
      <p class="meta" data-i18n="observeMeta"></p>
      <h2 class="prompt" id="prompt-text"></h2>
      <p class="quiet small" id="observe-note"></p>
      <textarea class="scratch" id="scratch" rows="8" placeholder="…" autocomplete="off" spellcheck="false"></textarea>
      <div class="observe-actions">
        <button class="link" type="button" id="another-prompt" data-i18n="observeAnother"></button>
        <button class="link" type="button" data-go="home" data-i18n="observeClose"></button>
      </div>
    </div>
  </section>

  <!-- Not-doing -->
  <section class="view" data-view="undo" hidden>
    <button class="leave" type="button" data-go="home" aria-label="leave">←</button>
    <div class="undo-wrap">
      <p class="meta" data-i18n="undoMeta"></p>
      <ul class="undo-list" id="undo-list" aria-label="not-doing list"></ul>
      <form class="undo-add" id="undo-form">
        <input
          type="text"
          id="undo-input"
          maxlength="140"
          autocomplete="off"
          enterkeyhint="done"
        />
      </form>
      <p class="quiet small" id="undo-note"></p>
    </div>
  </section>

  <!-- Enough -->
  <section class="view" data-view="enough" hidden>
    <button class="leave" type="button" data-go="home" aria-label="leave">←</button>
    <div class="enough-wrap">
      <p class="meta" data-i18n="enoughMeta"></p>
      <article class="slip" id="slip" aria-live="polite">
        <span class="slip-seal" aria-hidden="true"></span>
        <p class="slip-text" id="slip-text"></p>
      </article>
      <div class="enough-actions">
        <button class="link" type="button" id="enough-next" data-i18n="enoughAnother"></button>
        <button class="link" type="button" data-go="home" data-i18n="enoughClose"></button>
      </div>
      <p class="quiet small enough-note" id="enough-note"></p>
    </div>
  </section>

  <!-- Read -->
  <section class="view" data-view="read" hidden>
    <button class="leave" type="button" data-go="home" aria-label="leave">←</button>
    <div class="read-wrap">
      <p class="meta" id="read-meta"></p>
      <blockquote class="passage" id="passage"></blockquote>
      <div class="read-actions">
        <button class="link" type="button" id="read-next" data-i18n="readNext"></button>
        <button class="link" type="button" data-go="home" data-i18n="readEnough"></button>
      </div>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
