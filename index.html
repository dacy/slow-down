<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>慢</title>
<meta name="description" content="一个不替你提高效率的小练习。" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<noscript>
  <main class="noscript">
    <p>这个小东西需要 JavaScript 才能运行。</p>
    <p>但其实也不一定要打开它。</p>
  </main>
</noscript>

<main id="app" aria-live="polite">
  <!-- 入口 -->
  <section class="view" data-view="home" hidden>
    <header class="home-header">
      <h1 class="brand">慢</h1>
      <p class="tagline">不是少做一点事，是少被不重要的东西驱动。</p>
    </header>

    <nav class="menu" aria-label="练习">
      <button class="menu-item" data-go="sit">
        <span class="menu-title">坐一会</span>
        <span class="menu-sub">什么都不做。</span>
      </button>
      <button class="menu-item" data-go="observe">
        <span class="menu-title">观察一下</span>
        <span class="menu-sub">问自己一个问题。</span>
      </button>
      <button class="menu-item" data-go="undo">
        <span class="menu-title">不做</span>
        <span class="menu-sub">今天你选择不做的事。</span>
      </button>
      <button class="menu-item" data-go="read">
        <span class="menu-title">念几句</span>
        <span class="menu-sub">慢慢读，不必读完。</span>
      </button>
    </nav>

    <footer class="home-foot">
      <p class="quiet">这里没有数据、没有打卡、没有提醒。</p>
      <p class="quiet">用完关掉就好。</p>
    </footer>
  </section>

  <!-- 坐一会 -->
  <section class="view" data-view="sit" hidden>
    <button class="leave" data-go="home" aria-label="离开">←</button>
    <div class="sit-stage">
      <div class="breath" aria-hidden="true">
        <div class="breath-orb"></div>
      </div>
      <p class="breath-hint" id="breath-hint">跟着圆呼吸。</p>
    </div>
    <div class="sit-foot">
      <p class="quiet" id="sit-nudge"></p>
    </div>
  </section>

  <!-- 观察一下 -->
  <section class="view" data-view="observe" hidden>
    <button class="leave" data-go="home" aria-label="离开">←</button>
    <div class="observe-wrap">
      <p class="meta">今天的问题</p>
      <h2 class="prompt" id="prompt-text"></h2>
      <p class="quiet small">下面写什么都行。也可以什么都不写。<br>这里的字不会被保存。这是一段不必留下痕迹的时间。</p>
      <textarea class="scratch" id="scratch" rows="10" placeholder="…" autocomplete="off" spellcheck="false"></textarea>
      <div class="observe-actions">
        <button class="link" id="another-prompt">换一个问题</button>
        <button class="link" data-go="home">关掉</button>
      </div>
    </div>
  </section>

  <!-- 不做 -->
  <section class="view" data-view="undo" hidden>
    <button class="leave" data-go="home" aria-label="离开">←</button>
    <div class="undo-wrap">
      <p class="meta">今天我选择不做</p>
      <ul class="undo-list" id="undo-list" aria-label="不做清单"></ul>
      <form class="undo-add" id="undo-form">
        <input
          type="text"
          id="undo-input"
          placeholder="比如：不必把今天的散步变成一篇文章。"
          maxlength="140"
          autocomplete="off"
        />
      </form>
      <p class="quiet small">明天起床时，这个清单会清空。<br>它不为你积累什么。</p>
    </div>
  </section>

  <!-- 念几句 -->
  <section class="view" data-view="read" hidden>
    <button class="leave" data-go="home" aria-label="离开">←</button>
    <div class="read-wrap">
      <p class="meta" id="read-meta"></p>
      <blockquote class="passage" id="passage"></blockquote>
      <div class="read-actions">
        <button class="link" id="read-next">下一段</button>
        <button class="link" data-go="home">够了</button>
      </div>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
